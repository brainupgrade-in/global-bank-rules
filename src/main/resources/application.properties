#apliaction name
spring.application.name=rules
server.port=8090

#JWT SECRET TO GENERATE TOKEN
jwt.secret=sampletest

#servlet path
server.servlet.context-path=/rules

#authentication service url
feign.url-auth-service=${AUTH_SERVICE_URL:localhost:8084/auth}
feign.url-account-service=${ACCOUNT_SERVICE_URL:localhost:8086/account}

#ACTUATOR - kubernetes liveness/readiness probes
#Served under the context path: /rules/actuator/health/{liveness,readiness}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
